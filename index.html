<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แบบฟอร์มกรอกค่า</title>
<!--
  หน้าฟอร์มของ LINE LIFF — "ตัวจับข้อมูล" เท่านั้น ไม่คำนวณอะไรเลย

  ⚠️ สัญญากับบอท (line-group-bot · src/line/liff-form.ts) — รายละเอียดที่หัว form.js
    · ช่องตัวเลข · ช่องรายการแบบเพิ่มได้หลายแถว (เลือกจากรายการ + ตัวเลข)
      และช่องแบบแถวที่ค่าเป็นตัวเลขอิสระ + จำนวน (`kind:'rows'` — รายการโหลดของตู้ไฟ)
    · การวาดช่องอยู่ที่ ui.js (เทสต์เบราว์เซอร์จริงเรียกไฟล์เดียวกัน) ไฟล์นี้คุมแค่พรีวิว/ปุ่มส่ง/LIFF
    · หน้านี้ส่งกลับเข้าแชทเป็นข้อความเดียว รูปเดียวกับที่ผู้ใช้พิมพ์เองเป๊ะ — บอทเป็นผู้ตัดสินค่าตัวเดียว
      (หน้านี้ไม่ตรวจ min/max/จำนวนเต็มซ้ำ ใช้เป็นแอตทริบิวต์ช่วยกรอกเท่านั้น)
    · คำถามแบบรายการมีเพดานความยาวคำตอบ (maxLen) — ข้อความที่ยาวเกิน บอทไม่นับเป็นคำตอบ
      หน้านี้จึงไม่ให้กดส่ง และบอกจำนวนตัวอักษรให้เห็น

  ⚠️ ความปลอดภัย: หน้านี้เป็นสาธารณะ ใครก็สร้าง URL ที่มี f/z อะไรก็ได้
    · ป้ายและตัวเลือกแสดงด้วย textContent เท่านั้น ห้ามใช้ innerHTML
    · สิ่งที่ส่งเข้าแชทมีแต่ตัวเลข และค่าของตัวเลือกที่อยู่ในรายการที่ลิงก์ส่งมาเท่านั้น
-->
<link rel="stylesheet" href="./form.css">
</head>
<body>
<header id="title">กรอกค่าเพื่อคำนวณ</header>
<main>
  <form id="form" hidden>
    <div id="fields"></div>
    <div>จะส่งเข้าแชท:</div>
    <div class="preview" id="preview">—</div>
    <div class="count" id="count" hidden></div>
    <button type="submit" id="submit" disabled>ยืนยัน</button>
  </form>
  <div class="msg" id="msg" hidden></div>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script type="module">
  import { MESSAGES, openForm, showMessage } from './ui.js';

  /* LIFF ID ของแอป Engineer Girl — ไม่ใช่ความลับ (อยู่ในลิงก์ liff.line.me อยู่แล้ว) */
  const LIFF_ID = '2011553845-L5ydGKbv';

  /** ส่งข้อความเข้าแชท — ทางเดียวที่หน้านี้คุยกับ LINE (ตรรกะฟอร์มทั้งหมดอยู่ที่ ui.js) */
  async function sendToChat(text, reenable) {
    try {
      if (!liff.isInClient()) throw new Error('not-in-client');
      await liff.sendMessages([{ type: 'text', text }]);
      liff.closeWindow();
    } catch (e) {
      /*
       * เปิดนอกแอป LINE · เปิดซ้ำจาก "recently used" (403) · หรือ LIFF app ไม่ได้ติ๊ก scope
       * chat_message.write — ให้ผู้ใช้พิมพ์เองได้เสมอ และพิมพ์รหัสข้อผิดพลาดไว้ให้ไล่สาเหตุได้
       */
      const code = e && (e.code || e.message) ? String(e.code || e.message).slice(0, 60) : 'unknown';
      showMessage('ส่งเข้าแชทอัตโนมัติไม่ได้ — พิมพ์ข้อความนี้ในแชทแทนได้: ' + text + ' (รหัส: ' + code + ')');
      reenable();
    }
  }

  (async () => {
    try {
      await liff.init({ liffId: LIFF_ID });
    } catch (e) {
      showMessage(MESSAGES.liff);
      return;
    }
    openForm(location.search, sendToChat);
  })();
</script>
</body>
</html>
